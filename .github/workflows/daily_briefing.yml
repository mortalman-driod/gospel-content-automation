name: Daily Kingdom Briefing Automation

on:
  schedule:
    # Runs daily at 05:45 UTC (06:45 AM Lagos time / WAT) for autonomous image synthesis & briefing dispatch
    - cron: '45 5 * * *'
  workflow_dispatch: # Allows 1-click manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  run-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Autonomous Cloud Image Synthesis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/cloud_image_generator.py

      - name: Execute Daily Gospel Briefing & Email Dispatch
        env:
          SMTP_HOST: "smtp.gmail.com"
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/send_luxury_editorial_email.py

      - name: Persist Execution State & Database to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/gospel_history.db data/execution_state.json reports/fliers/
          # Only commit and push if state or database changed
          git diff --staged --quiet || (git commit -m "chore(db): persist daily briefing execution state and database [skip ci]" && git push origin main)
